<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>간편장부 만들기</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.7;
    background: #fafaf8;
    color: #222;
  }
  main { max-width: 32rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
  p.lead { color: #555; margin: 0 0 2rem; }
  .box {
    border: 1px dashed #bbb;
    border-radius: 8px;
    padding: 2.5rem 1rem;
    color: #888;
    font-size: .95rem;
  }
  footer { margin-top: 2rem; font-size: .8rem; color: #999; }
</style>
</head>
<body>
<main>
  <h1>간편장부 만들기</h1>
  <p class="lead">카드 이용내역과 전자세금계산서 목록을 올리면<br>간편장부 서식에 맞춰 정리해 드립니다.</p>

  <div class="box">
    여기에 파일 업로드 화면이 들어갑니다
  </div>

  <footer>2026년 귀속 · 준비 중</footer>
</main>
</body>
</html>
